<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposals — Campbell Consultancy Portal</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<script src="assets/layout.js"></script>
<script>requireAuth('/');</script>

<!-- Topbar -->
<header class="topbar" id="topbar"></header>

<!-- Hero -->
<div class="portal-hero">
  <div class="eyebrow">Campbell Consultancy · Portal</div>
  <h1>Client <em>Proposals</em></h1>
  <p class="subtitle">Project proposals, scope documents, and technology specifications.</p>
</div>

<!-- Main -->
<main>
  <a class="back-link" href="portal.html">← Back to portal</a>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search by client or type…" autocomplete="off">
  </div>

  <div id="clients-list"></div>

  <div class="empty-state" id="empty-state" style="display:none;">
    <div class="empty-icon">🔍</div>
    <p>No proposals match your search.</p>
  </div>
</main>

<!-- Footer -->
<footer id="footer"></footer>

<script>
  injectTopbar({ root: '/', section: 'Proposals' });
  injectFooter();

  const BASE = 'https://proposals.campbellconsultancy.co';

  // ── Proposals data ─────────────────────────────────────────────
  // To add a proposal: copy an object, update client, type, file, date
  const proposals = [
    {
      client: 'Fan Rescue Ltd',
      type: 'WhatsApp / Xero — Payroll, Accounting, Quote, Proposal & Invoicing',
      file: 'fr-whatsapp-combined.html',
      date: '2026-05-11',
    },
    {
      client: 'Roots & Seeds Kitchen Garden',
      type: 'HR, Payroll & Onboarding Automation',
      file: 'roots-and-seeds.html',
      date: '2026-04-01',
    },
    {
      client: 'H.E.R.O — Home Emergency Response Organisation',
      type: 'Pilot Programme & Technology Specification',
      file: 'hero.html',
      date: '2026-05-19',
    },
    {
      client: 'H.E.R.O — Home Emergency Response Organisation',
      type: 'White Paper — The Case for HERO, Gloucestershire',
      file: 'hero-white-paper.html',
      date: '2026-05-19',
    },
  ];

  function proposalUrl(file) { return BASE + '/' + file; }

  function groupByClient(items) {
    const map = new Map();
    items.forEach(p => {
      if (!map.has(p.client)) map.set(p.client, []);
      map.get(p.client).push(p);
    });
    const groups = [];
    map.forEach((files, client) => {
      files.sort((a, b) => new Date(b.date) - new Date(a.date));
      groups.push({ client, files, latest: files[0].date });
    });
    groups.sort((a, b) => new Date(b.latest) - new Date(a.latest));
    return groups;
  }

  function render(filter) {
    const list  = document.getElementById('clients-list');
    const empty = document.getElementById('empty-state');

    const filtered = filter
      ? proposals.filter(p =>
          p.client.toLowerCase().includes(filter) ||
          p.type.toLowerCase().includes(filter))
      : proposals;

    list.innerHTML = '';

    if (filtered.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    const groups = groupByClient(filtered);

    // Section header
    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = `<span class="section-num">01</span><h2>Clients</h2>`;
    list.appendChild(hdr);

    const container = document.createElement('div');
    container.style.cssText = 'display:flex;flex-direction:column;gap:12px;';
    list.appendChild(container);

    groups.forEach((group, gi) => {
      const isOpen = !!(filter || group.files.length === 1);
      const grp = document.createElement('div');
      grp.className = 'client-group fade-up' + (isOpen ? ' open' : '');
      grp.style.animationDelay = (gi * 0.06) + 's';

      const countLabel = group.files.length === 1 ? '1 proposal' : group.files.length + ' proposals';

      const filesHtml = group.files.map(p => {
        const link = proposalUrl(p.file);
        return `
          <div class="file-row">
            <div class="file-info">
              <div class="file-type">${p.type}</div>
              <div class="file-meta">
                <span class="file-date">${formatDate(p.date)}</span>
                <span class="file-path">${link}</span>
              </div>
            </div>
            <div class="file-actions">
              <button class="btn-copy" onclick="event.stopPropagation();copyLink('${link}',this)">⎘ Copy link</button>
              <a class="btn-open" href="${link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open ↗</a>
            </div>
          </div>
        `;
      }).join('');

      grp.innerHTML = `
        <div class="client-header" onclick="toggleGroup(this.parentElement)">
          <div>
            <div class="client-name-grad">${group.client}</div>
            <span class="client-count-pill">
              <span class="dot"></span>${countLabel}
              <span class="client-latest-label">· Latest ${formatDate(group.latest)}</span>
            </span>
          </div>
          <div class="client-toggle" aria-hidden="true">▾</div>
        </div>
        <div class="files-panel">
          <div class="files-inner">${filesHtml}</div>
        </div>
      `;
      container.appendChild(grp);
    });
  }

  function toggleGroup(el) { el.classList.toggle('open'); }

  function copyLink(link, btn) {
    navigator.clipboard.writeText(link).then(() => {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
    });
  }

  document.getElementById('search').addEventListener('input', function() {
    render(this.value.trim().toLowerCase() || null);
  });

  render(null);
</script>
</body>
</html>
