  <link rel="stylesheet" href="assets/style.css">

<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo-wrap">
      <img
        class="login-logo"
        src="https://campbellconsultancy.co/brand/Campbell_Consultancy_Logo_Pack/02_Horizontal/PNG_WhiteBG/horizontal-gradient-on-white-512px.png"
        alt="Campbell Consultancy"
      >
    </div>
    <h1>Client Portal</h1>
    <p class="login-sub">Enter your access password to continue.</p>
    <p class="login-error" id="loginError">Incorrect password. Please try again.</p>
    <div class="login-field">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="current-password"
        autofocus
      >
    </div>
    <button class="btn-login" id="loginBtn">Access Portal</button>
  </div>
</div>

<script>
  const PORTAL_PASSWORD = 'campbell2026';
  const SESSION_KEY = 'cc_portal_auth';

  if (sessionStorage.getItem(SESSION_KEY) === 'true') {
    window.location.href = 'portal.html';
  }

  function attemptLogin() {
    const val = document.getElementById('password').value;
    if (val === PORTAL_PASSWORD) {
      sessionStorage.setItem(SESSION_KEY, 'true');
      window.location.href = 'portal.html';
    } else {
      document.getElementById('loginError').classList.add('visible');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }

  document.getElementById('loginBtn').addEventListener('click', attemptLogin);
  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') attemptLogin();
  });
</script>
</body>
</html>
